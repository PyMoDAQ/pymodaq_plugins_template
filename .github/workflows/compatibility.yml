# Everything is defined once in PyMoDAQ/pymodaq_plugins_template (reusable-*.yml). The ref after @ is the 5.3.x branch for now: use a release tag (@v1) once it exists.
name: Compatibility with pymodaq (latest release)

on:
  pull_request:
  push:
    branches: [main, master, '[0-9]*.x']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    uses: PyMoDAQ/pymodaq_plugins_template/.github/workflows/reusable-compatibility.yml@5.3.x
