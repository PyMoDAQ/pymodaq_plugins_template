# Shared by all plugins: flake8 gate and unit tests on one Python version and one Qt backend.
# Deliberately a single configuration (Linux, Python 3.11, PySide6 by default): this is the fast gate that gives an
# answer in about a minute. The spread over OS, Python versions and Qt backends is tested by reusable-compatibility.yml
# (a subset that skips Python 3.11, which is thus covered here).
# Called from the small `tests.yml` of a plugin, do not copy this file into a plugin.
name: Reusable tests

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.11'
      qt-backend:
        type: string
        default: pyside6

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_DEBUG_PLUGINS: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # history and tags, needed by hatch-vcs: without them the version is 0.1.dev and e.g. pymodaq_plugins_mock cannot satisfy pymodaq's own requirement
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-cursor0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1 libegl1
          sudo mkdir -p /etc/.pymodaq
          sudo chmod uo+rw /etc/.pymodaq
      - name: Install the plugin
        # PySide6 6.12.0 aborts (garbage collector) after the tests that open PyMoDAQ's Dashboard, see PyMoDAQ issue #1275
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-qt pytest-xvfb ${{ inputs.qt-backend == 'pyside6' && 'pyside6!=6.12.0' || inputs.qt-backend }}
          pip install -e .
      - name: Lint (syntax errors and undefined names only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Tests
        # no xdist: parallel workers race to create the PyMoDAQ config folder on a fresh runner
        run: pytest tests
