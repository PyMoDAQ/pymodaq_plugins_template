[features]  # defines the plugin features contained into this plugin
instruments = true  # true if plugin contains instrument classes (else false, notice the lowercase for toml files)
extensions = false  # true if plugins contains dashboard extensions
models = false  # true if plugins contains models of the extensions (PID, optimizers, data mixer, sequencer, ...)
h5exporters = false  # true if plugin contains custom h5 file exporters
scanners = false  # true if plugin contains custom scan layout (daq_scan extensions)

[urls]
package-url = 'https://github.com/PyMoDAQ/pymodaq_plugins_template' #todo modify url by your plugin url

[project]
name = "pymodaq_plugins_template" #todo modify template by your plugin short name
description = 'some word about your plugin'
dependencies = [
    "pymodaq>=5.3.2",
    "pymodaq_utils>=5.3.1",
    "pymodaq_gui>=5.3.0",
    "pymodaq_data>=5.3.0",
    #todo: list here all dependencies your package may have
]

authors = [
    {name = "Name Surname", email = "myname@test.fr"},
    #todo: list here all authors of your plugin
]
maintainers = [
    {name = "Name Surname", email = "myname@test.fr"},
    #todo: list here all maintainers of your plugin
]

# nottodo: leave everything below as is!

dynamic = ["version", "urls", "entry-points", "classifiers"]
readme = "README.rst"
license = { file="LICENSE" }
requires-python = ">=3.10"

[build-system]
requires = [
    "hatchling>=1.9.0",
    "hatch-vcs", "toml",
    "pymodaq_utils>=5.3.6",
]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.version]
source = "vcs"

[tool.pymodaq]
# the "Operating System" and "Programming Language :: Python :: 3.x" classifiers are added when building the package,
# from supported_platforms in your instrument plugins and from requires-python
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
